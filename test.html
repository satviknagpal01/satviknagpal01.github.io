<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Test</title>
  <link rel="stylesheet" href="./src/css/style.css" />
</head>
<body class="sound-test">

  <div class="test-container">
    <h1>🎛️ Retro Sound Tester</h1>

    <canvas id="visualizer" width="320" height="120"></canvas>

    <div class="test-controls">
      <label>Waveform:
        <select id="wave">
          <option value="square">Square</option>
          <option value="sine">Sine</option>
          <option value="triangle">Triangle</option>
          <option value="sawtooth">Sawtooth</option>
        </select>
      </label>

      <label>Frequency (Hz):
        <input type="range" id="freq" min="100" max="2000" value="440" />
        <span id="freqVal">440</span>
      </label>

      <label>Duration (s):
        <input type="range" id="dur" min="0.05" max="2" step="0.05" value="0.3" />
        <span id="durVal">0.3</span>
      </label>

      <label>Volume:
        <input type="range" id="vol" min="0" max="1" step="0.05" value="0.5" />
        <span id="volVal">0.5</span>
      </label>
    </div>

    <button id="playBtn" class="pixel-btn">▶ Play Sound</button>
  </div>

  <script type="module" src="./src/js/test.js"></script>
</body>
</html>
