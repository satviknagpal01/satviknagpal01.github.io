<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Retro Sound Tester</title>
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body class="sound-test">
  <main style="padding:24px; max-width:720px; margin:24px auto;">
    <h1>Retro Sound Tester</h1>
    <canvas id="visualizer" width="720" height="160"></canvas>
    <div>
      <label>Wave: <select id="wave"><option>square</option><option>sine</option><option>triangle</option><option>sawtooth</option></select></label>
      <label>Freq: <input id="freq" type="range" min="100" max="2000" value="440"><span id="freqVal">440</span></label>
      <label>Dur: <input id="dur" type="range" min="0.05" max="2" step="0.01" value="0.3"><span id="durVal">0.3</span></label>
      <label>Vol: <input id="vol" type="range" min="0" max="1" step="0.01" value="0.5"><span id="volVal">0.5</span></label>
      <button id="playBtn">Play</button>
    </div>
  </main>
  <script type="module" src="/test/test.js"></script>
</body>
</html>
